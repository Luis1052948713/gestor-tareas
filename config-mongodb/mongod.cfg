# mongod.conf - ajustado para equipos con poca RAM

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  dbPath: C:\Program Files\MongoDB\Server\8.0\data
  wiredTiger:
    engineConfig:
      # Limita la caché de MongoDB a 256 MB (por defecto usa ~la mitad de la RAM)
      cacheSizeGB: 0.25

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path:  C:\Program Files\MongoDB\Server\8.0\log\mongod.log

# network interfaces
net:
  port: 27017
  bindIp: 127.0.0.1

# Desactiva la recolección de diagnósticos (FTDC), que es la que fallaba por falta de memoria
setParameter:
  diagnosticDataCollectionEnabled: false
